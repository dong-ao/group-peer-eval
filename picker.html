<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抽组演进 — 课堂随机抽组</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex;
    justify-content: center; align-items: center; padding: 16px;
  }
  .container { max-width: 500px; width: 100%; }

  /* Header */
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 26px; color: #fff; }
  .header p { font-size: 14px; color: #888; margin-top: 6px; }

  /* Main display */
  .display-area {
    background: #1a1a2e; border-radius: 20px; padding: 24px 20px;
    text-align: center; margin-bottom: 16px; position: relative; overflow: hidden;
    border: 2px solid #2a2a4a; transition: border-color 0.3s, box-shadow 0.3s;
  }
  .display-area.spinning { border-color: #6366f1; box-shadow: 0 0 40px rgba(99,102,241,0.3); }
  .display-area.result-presenter { border-color: #22c55e; box-shadow: 0 0 40px rgba(34,197,94,0.3); }
  .display-area.result-evaluators { border-color: #3b82f6; box-shadow: 0 0 40px rgba(59,130,246,0.3); }

  .phase-label {
    font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
  }

  /* Presenter display */
  .presenter-display { margin-bottom: 8px; }
  .presenter-display .group-number {
    font-size: 88px; font-weight: 800; color: #6366f1; line-height: 1;
    transition: color 0.3s, transform 0.1s;
  }
  .display-area.result-presenter .presenter-display .group-number { color: #22c55e; }
  .presenter-label { font-size: 15px; color: #aaa; margin-top: 4px; }

  /* Evaluator display */
  .evaluator-section {
    display: none; margin-top: 16px; padding-top: 16px;
    border-top: 1px solid #2a2a4a;
  }
  .evaluator-section.visible { display: block; }
  .evaluator-section .section-title {
    font-size: 13px; color: #888; margin-bottom: 10px;
  }
  .evaluator-slots {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  }
  .eval-slot {
    width: 56px; height: 56px; border-radius: 14px;
    background: #1e1e36; border: 2px dashed #3a3a5a;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #555;
    transition: all 0.4s;
  }
  .eval-slot.filled {
    background: #1a2440; border-color: #3b82f6; border-style: solid;
    color: #60a5fa; animation: evaluatorReveal 0.5s ease-out;
  }
  @keyframes evaluatorReveal {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-text {
    display: none; font-size: 15px; color: #22c55e; margin-top: 10px; font-weight: 600;
  }
  .display-area.result-presenter .result-text { display: block; }

  /* Evaluator action hint */
  .eval-action-hint {
    display: none; margin-top: 12px; font-size: 13px; color: #fbbf24; line-height: 1.6;
  }
  .display-area.result-evaluators .eval-action-hint { display: block; }

  /* Button */
  .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .btn {
    flex: 1; padding: 15px 12px; border: none; border-radius: 14px;
    font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.96); }
  .btn-draw {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; box-shadow: 0 6px 24px rgba(99,102,241,0.4);
  }
  .btn-draw:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-draw.drawing {
    background: linear-gradient(135deg, #ef4444, #f97316);
    box-shadow: 0 6px 24px rgba(239,68,68,0.4);
  }
  .btn-draw.next-round {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    box-shadow: 0 6px 24px rgba(34,197,94,0.4);
  }
  .btn-reset {
    background: transparent; border: 2px solid #3a3a5a; color: #666; font-size: 13px;
    padding: 10px; width: 100%;
  }
  .btn-reset:hover { border-color: #ef4444; color: #ef4444; }

  /* Group grid */
  .group-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .group-card {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 14px; font-size: 20px; font-weight: 700;
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #ccc;
    transition: all 0.15s; position: relative; cursor: default;
  }
  .group-card small { font-size: 10px; font-weight: 400; color: #888; margin-top: 2px; }
  .group-card .badge {
    display: none; position: absolute; top: 4px; right: 6px;
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px;
    line-height: 1.4;
  }

  /* Presenter */
  .group-card.is-presenter {
    background: #1a2e1a; border-color: #22c55e; color: #4ade80;
    box-shadow: 0 0 20px rgba(34,197,94,0.4);
  }
  .group-card.is-presenter .badge {
    display: block; background: #22c55e; color: #000;
  }

  /* Evaluator */
  .group-card.is-evaluator {
    background: #1a2440; border-color: #3b82f6; color: #93c5fd;
    box-shadow: 0 0 16px rgba(59,130,246,0.35);
  }
  .group-card.is-evaluator .badge {
    display: block; background: #3b82f6; color: #fff;
  }

  /* Done (presented before) */
  .group-card.is-done {
    background: #1e1e2a; border-color: #2a2a3a; color: #666;
  }
  .group-card.is-done::after {
    content: '✓'; position: absolute; top: 4px; right: 8px;
    font-size: 12px; color: #555;
  }

  /* Flash during spin — border glow only, color stays neutral for trajectory visibility */
  .group-card.spin-active {
    border-color: #fbbf24; color: #fbbf24;
    box-shadow: 0 0 20px rgba(251,191,36,0.5);
    transform: scale(1.06);
  }

  /* Stats */
  .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .stats .remaining { font-size: 13px; color: #888; }
  .stats .remaining span { color: #6366f1; font-weight: 700; font-size: 17px; }

  /* Phase indicator dots */
  .phase-indicator { display: flex; gap: 6px; align-items: center; justify-content: center; margin-bottom: 16px; }
  .phase-dot { width: 8px; height: 8px; border-radius: 50%; background: #2a2a4a; transition: all 0.3s; }
  .phase-dot.active { background: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.6); }
  .phase-dot.done { background: #22c55e; }
  .phase-label-mini { font-size: 11px; color: #666; margin: 0 4px; }

  /* Round History */
  .history { background: #1a1a2e; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .history h3 { font-size: 14px; color: #888; margin-bottom: 12px; }
  .history-list { display: flex; flex-direction: column; gap: 8px; min-height: 24px; }
  .history-list .empty { color: #555; font-size: 14px; text-align: center; padding: 8px 0; }
  .round-card {
    background: #141426; border-radius: 10px; padding: 10px 14px;
    border-left: 3px solid #22c55e; font-size: 13px; line-height: 1.6;
  }
  .round-card .round-num { font-weight: 700; color: #22c55e; }
  .round-card .presenter-name { color: #4ade80; font-weight: 600; }
  .round-card .eval-names { color: #93c5fd; }
  .round-card .arrow { color: #666; margin: 0 4px; }

  /* Archive panel */
  .archive-panel {
    display: none; background: #1a1a2e; border-radius: 14px; padding: 16px; margin-bottom: 12px;
    border: 1px solid #6366f1;
  }
  .archive-panel.visible { display: block; }
  .archive-panel h3 { font-size: 14px; color: #6366f1; margin-bottom: 12px; }
  .archive-item {
    background: #141426; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
    font-size: 12px; line-height: 1.5; border-left: 2px solid #6366f1;
  }
  .archive-item .time { color: #666; font-size: 11px; }
  .archive-item .detail { color: #ccc; }
  .archive-empty { color: #555; font-size: 13px; text-align: center; padding: 12px 0; }

  .btn-archive {
    width: 100%; padding: 10px; border: 1px solid #3a3a5a; border-radius: 12px;
    background: transparent; color: #888; font-size: 13px; cursor: pointer;
    margin-bottom: 10px; transition: all 0.2s;
  }
  .btn-archive:hover { border-color: #6366f1; color: #6366f1; }

  .btn-clear-archive {
    background: transparent; border: none; color: #ef4444; font-size: 12px;
    cursor: pointer; padding: 4px 8px; float: right;
  }
  .btn-clear-archive:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    .group-grid { gap: 5px; }
    .group-card { font-size: 16px; border-radius: 10px; }
    .group-card small { font-size: 9px; }
    .presenter-display .group-number { font-size: 68px; }
    .btn { font-size: 15px; padding: 12px 8px; }
    .eval-slot { width: 48px; height: 48px; font-size: 18px; }
  }
  @media (max-width: 360px) {
    .group-grid { gap: 4px; }
    .group-card { font-size: 14px; border-radius: 8px; }
    .group-card small { font-size: 8px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>&#127919; 抽组演进</h1>
    <p>抽汇报组 → 抽 4 组点评</p>
  </div>

  <!-- Phase indicator -->
  <div class="phase-indicator">
    <div class="phase-dot active" id="phaseDot1"></div>
    <span class="phase-label-mini">汇报</span>
    <span style="color:#333;">→</span>
    <div class="phase-dot" id="phaseDot2"></div>
    <span class="phase-label-mini">点评</span>
  </div>

  <!-- Main display -->
  <div class="display-area" id="displayArea">
    <!-- Presenter section -->
    <div class="presenter-display">
      <div class="phase-label">汇报组</div>
      <div class="group-number" id="displayPresenter">?</div>
      <div class="presenter-label" id="displayLabel">准备开始</div>
    </div>
    <div class="result-text" id="resultText">&#127942; 请上台汇报！</div>

    <!-- Evaluator section -->
    <div class="evaluator-section" id="evaluatorSection">
      <div class="section-title">点评组（抽 4 组）</div>
      <div class="evaluator-slots" id="evaluatorSlots">
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
      </div>
      <div class="eval-action-hint" id="evalActionHint">
        &#9200; 各组讨论 2~3 分钟，派代表上台点评<br>
        &#128172; 点评后汇报组可回应，双向交流
      </div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-draw" id="btnDraw" onclick="toggleDraw()">开始抽取汇报组</button>
  </div>

  <!-- Group grid -->
  <div class="group-grid" id="groupGrid"></div>

  <!-- Stats -->
  <div class="stats">
    <div class="remaining">待汇报 <span id="remainingCount">10</span> 组</div>
    <div class="remaining" style="color:#888;">已完成 <span id="completedRounds" style="color:#22c55e;font-weight:700;">0</span> 轮</div>
  </div>

  <!-- Round History (current session) -->
  <div class="history">
    <h3>&#128214; 本轮抽取记录</h3>
    <div class="history-list" id="historyList">
      <span class="empty">尚未抽取</span>
    </div>
  </div>

  <!-- Archive: persistent across resets -->
  <button class="btn-archive" id="btnArchive" onclick="toggleArchive()">
    &#128451; 查看全部抽签记录（<span id="archiveCount">0</span> 条历史）
  </button>
  <div class="archive-panel" id="archivePanel">
    <h3>&#128451; 全部抽签记录（持久保存）</h3>
    <button class="btn-clear-archive" onclick="clearArchive()">清空记录</button>
    <div id="archiveList"></div>
  </div>

  <!-- Reset at bottom, away from main action -->
  <div class="btn-row" style="margin-top: 4px;">
    <button class="btn btn-reset" id="btnReset" onclick="resetAll()">重置本轮（历史记录保留）</button>
  </div>
</div>

<script>
const TOTAL = 10;
const EVAL_COUNT = 4;

// 组名概括（3~6字）
const GROUP_NAMES = {
  1: 'AI谄媚与推理',
  2: '隐私信息均衡',
  3: 'AI共情抑制',
  4: '人机协同学习',
  5: 'AI美育干预',
  6: '病毒传播教育',
  7: 'AI失真批判',
  8: 'AI模拟教学',
  9: 'AI幻觉免疫',
  10: '绘本戏剧干预'
};

// rounds: [{presenter: N, evaluators: [a,b,c,d]}, ...]
let rounds = [];
let currentPresenter = null;
let currentEvaluators = [];
// phase: idle | drawing_presenter | presenter_done | drawing_evaluators | evaluators_done | complete
let phase = 'idle';
let spinning = false;
let spinTimer = null;

// ===== Persistence =====

function loadRounds() {
  try {
    const raw = localStorage.getItem('group_rounds_v2');
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem('group_pick_history');
    if (old) {
      const oldHistory = JSON.parse(old);
      if (Array.isArray(oldHistory) && oldHistory.length > 0 && typeof oldHistory[0] === 'number') {
        return oldHistory.map(p => ({presenter: p, evaluators: []}));
      }
      if (Array.isArray(oldHistory) && oldHistory.length > 0 && oldHistory[0].presenter) {
        return oldHistory;
      }
    }
    return [];
  } catch(e) { return []; }
}

function saveRounds() {
  localStorage.setItem('group_rounds_v2', JSON.stringify(rounds));
}

// Archive — persistent across resets, never cleared except explicitly
function loadArchive() {
  try {
    const raw = localStorage.getItem('group_rounds_archive');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveArchiveEntry(entry) {
  const archive = loadArchive();
  archive.push(entry);
  localStorage.setItem('group_rounds_archive', JSON.stringify(archive));
}

function clearArchive() {
  if (confirm('确定要清空全部抽签历史记录吗？此操作不可撤销。')) {
    localStorage.removeItem('group_rounds_archive');
    renderArchive();
  }
}

function renderArchive() {
  const archive = loadArchive();
  const list = document.getElementById('archiveList');
  document.getElementById('archiveCount').textContent = archive.length;

  if (archive.length === 0) {
    list.innerHTML = '<div class="archive-empty">暂无历史记录</div>';
    return;
  }

  list.innerHTML = archive.slice().reverse().map((entry, i) => {
    const d = new Date(entry.timestamp);
    const timeStr = d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0') + ' ' +
      String(d.getHours()).padStart(2, '0') + ':' +
      String(d.getMinutes()).padStart(2, '0');
    const evalStr = entry.evaluators.length > 0
      ? ' → 第' + entry.evaluators.join('、') + '组 点评'
      : '（未抽点评组）';
    return '<div class="archive-item">'
      + '<span class="detail"><b style="color:#4ade80;">第' + entry.presenter + '组</b> 汇报' + evalStr + '</span>'
      + ' <span class="time">' + timeStr + '</span>'
      + '</div>';
  }).join('');
}

function toggleArchive() {
  const panel = document.getElementById('archivePanel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible')) {
    renderArchive();
  }
}

// ===== State helpers =====

function getPresentedSet() {
  return new Set(rounds.map(r => r.presenter));
}

function getAvailablePresenters() {
  const done = getPresentedSet();
  const avail = [];
  for (let i = 1; i <= TOTAL; i++) {
    if (!done.has(i)) avail.push(i);
  }
  return avail;
}

function getAvailableEvaluators() {
  const avail = [];
  for (let i = 1; i <= TOTAL; i++) {
    if (i !== currentPresenter) avail.push(i);
  }
  return avail;
}

// ===== Rendering =====

function renderGrid(spinHighlight) {
  const grid = document.getElementById('groupGrid');
  const presented = getPresentedSet();
  const evalSet = new Set(currentEvaluators);
  let html = '';
  for (let i = 1; i <= TOTAL; i++) {
    let cls = 'group-card';
    let badge = '';

    if (i === currentPresenter) {
      cls += ' is-presenter';
      badge = '<span class="badge">汇报</span>';
    } else if (evalSet.has(i)) {
      cls += ' is-evaluator';
      badge = '<span class="badge">点评</span>';
    } else if (presented.has(i) && i !== currentPresenter) {
      cls += ' is-done';
    }

    // Spin highlight — only apply to non-presenter, non-evaluator, non-done cards
    if (spinHighlight === i && i !== currentPresenter && !evalSet.has(i)) {
      cls += ' spin-active';
    }

    html += '<div class="' + cls + '">' + badge + i + '<small>' + (GROUP_NAMES[i] || '第' + i + '组') + '</small></div>';
  }
  grid.innerHTML = html;
}

function renderEvaluatorSlots() {
  const slots = document.getElementById('evaluatorSlots');
  let html = '';
  for (let i = 0; i < EVAL_COUNT; i++) {
    const val = currentEvaluators[i] || null;
    const cls = val ? 'eval-slot filled' : 'eval-slot';
    const text = val ? val : '?';
    html += '<div class="' + cls + '">' + text + '</div>';
  }
  slots.innerHTML = html;
}

function renderRoundHistory() {
  const list = document.getElementById('historyList');
  if (rounds.length === 0) {
    list.innerHTML = '<span class="empty">尚未抽取</span>';
    return;
  }
  list.innerHTML = rounds.map((r, i) => {
    const evalStr = r.evaluators.length > 0
      ? '<span class="eval-names">第' + r.evaluators.join('、') + '组</span>'
      : '<span style="color:#666;">未抽点评组</span>';
    return '<div class="round-card">'
      + '<span class="round-num">第' + (i + 1) + '轮</span> '
      + '<span class="presenter-name">第' + r.presenter + '组</span> 汇报'
      + '<span class="arrow">→</span>'
      + evalStr + ' 点评'
      + '</div>';
  }).join('');
}

function updateStats() {
  document.getElementById('remainingCount').textContent = TOTAL - getPresentedSet().size;
  document.getElementById('completedRounds').textContent = rounds.filter(r => r.evaluators.length > 0).length;
}

function updatePhaseIndicator() {
  const dot1 = document.getElementById('phaseDot1');
  const dot2 = document.getElementById('phaseDot2');
  dot1.classList.remove('active', 'done');
  dot2.classList.remove('active', 'done');

  if (phase === 'idle' || phase === 'drawing_presenter') {
    dot1.classList.add('active');
  } else if (phase === 'presenter_done' || phase === 'drawing_evaluators') {
    dot1.classList.add('done');
    dot2.classList.add('active');
  } else if (phase === 'evaluators_done' || phase === 'complete') {
    dot1.classList.add('done');
    dot2.classList.add('done');
  }
}

function updateDisplay(presenterNum, label, areaCls) {
  document.getElementById('displayPresenter').textContent = presenterNum;
  document.getElementById('displayLabel').textContent = label;
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning', 'result-presenter', 'result-evaluators');
  if (areaCls) area.classList.add(areaCls);
}

// ===== Button management =====

function updateButton() {
  const btn = document.getElementById('btnDraw');
  btn.classList.remove('drawing', 'next-round');
  btn.disabled = false;

  switch (phase) {
    case 'idle':
      btn.textContent = '开始抽取汇报组';
      break;
    case 'drawing_presenter':
      btn.textContent = '停止抽取';
      btn.classList.add('drawing');
      break;
    case 'presenter_done':
      btn.textContent = '抽取 4 组点评';
      break;
    case 'drawing_evaluators':
      btn.textContent = '停止抽取';
      btn.classList.add('drawing');
      break;
    case 'evaluators_done': {
      const avail = getAvailablePresenters();
      if (avail.length === 0) {
        btn.textContent = '全部完成！';
        btn.disabled = true;
      } else {
        btn.textContent = '下一轮（抽汇报组）';
        btn.classList.add('next-round');
      }
      break;
    }
    case 'complete':
      btn.textContent = '全部完成！';
      btn.disabled = true;
      break;
  }
}

// ===== Drawing logic =====

function toggleDraw() {
  switch (phase) {
    case 'idle':        startDrawPresenter(); break;
    case 'drawing_presenter':  stopDrawPresenter(); break;
    case 'presenter_done':    startDrawEvaluators(); break;
    case 'drawing_evaluators':  stopDrawEvaluators(); break;
    case 'evaluators_done':   nextRound(); break;
    case 'complete':       break;
  }
}

// ----- Draw Presenter -----

function startDrawPresenter() {
  const available = getAvailablePresenters();
  if (available.length === 0) {
    phase = 'complete';
    updateDisplay('!', '所有小组已汇报完毕', '');
    updateButton();
    updatePhaseIndicator();
    return;
  }

  spinning = true;
  currentPresenter = null;
  currentEvaluators = [];
  phase = 'drawing_presenter';

  updateButton();
  updatePhaseIndicator();
  document.getElementById('btnReset').disabled = true;

  const area = document.getElementById('displayArea');
  area.classList.remove('result-presenter', 'result-evaluators');
  area.classList.add('spinning');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  updateDisplay('?', '正在抽取汇报组...', '');

  // Pre-select result: first draw ever → Group 1; otherwise random
  let pick;
  if (rounds.length === 0) {
    pick = 1;
  } else {
    pick = available[Math.floor(Math.random() * available.length)];
  }

  runPresenterSpin(available, pick, () => stopDrawPresenter(pick));
}

function stopDrawPresenter(pick) {
  spinning = false;
  if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }

  currentPresenter = pick;
  phase = 'presenter_done';

  rounds.push({presenter: pick, evaluators: []});
  saveRounds();
  // Save to persistent archive immediately
  saveArchiveEntry({
    presenter: pick,
    evaluators: [],
    timestamp: new Date().toISOString()
  });

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning');
  area.classList.add('result-presenter');
  updateDisplay(pick, '第' + pick + '组', 'result-presenter');
  document.getElementById('resultText').style.display = 'block';

  document.getElementById('evaluatorSection').classList.add('visible');
  renderEvaluatorSlots();

  updateButton();
  updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid();
  renderRoundHistory();
  updateStats();
  renderArchive();
}

// ----- Draw Evaluators -----

function startDrawEvaluators() {
  const available = getAvailableEvaluators();
  if (available.length < EVAL_COUNT) {
    alert('可用点评组不足4组，请先重置。');
    return;
  }

  spinning = true;
  currentEvaluators = [];
  phase = 'drawing_evaluators';

  updateButton();
  updatePhaseIndicator();
  document.getElementById('btnReset').disabled = true;

  const area = document.getElementById('displayArea');
  area.classList.remove('result-presenter');
  area.classList.add('spinning');
  document.getElementById('evalActionHint').style.display = 'none';
  updateDisplay(currentPresenter, '正在抽取 4 组点评...', '');

  // Pre-select 4 evaluators
  const pool = [...available];
  const picked = [];
  for (let i = 0; i < EVAL_COUNT; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  picked.sort((a, b) => a - b);

  // Show cycling through available until stopped
  runSpin(available, () => stopDrawEvaluators(picked));
}

function stopDrawEvaluators(picked) {
  spinning = false;
  if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }

  currentEvaluators = picked;

  // Update current round
  const lastRound = rounds[rounds.length - 1];
  if (lastRound && lastRound.presenter === currentPresenter) {
    lastRound.evaluators = picked;
  }
  saveRounds();

  // Update archive entry
  const archive = loadArchive();
  if (archive.length > 0) {
    const lastArchive = archive[archive.length - 1];
    if (lastArchive.presenter === currentPresenter && lastArchive.evaluators.length === 0) {
      lastArchive.evaluators = picked;
      lastArchive.timestamp = new Date().toISOString();
      localStorage.setItem('group_rounds_archive', JSON.stringify(archive));
    }
  }

  phase = 'evaluators_done';

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning');
  area.classList.add('result-evaluators');
  updateDisplay(currentPresenter, '第' + currentPresenter + '组', 'result-evaluators');
  document.getElementById('resultText').style.display = 'block';

  renderEvaluatorSlots();
  document.getElementById('evaluatorSection').classList.add('visible');
  setTimeout(() => {
    document.getElementById('evalActionHint').style.display = 'block';
  }, 800);

  updateButton();
  updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid();
  renderRoundHistory();
  updateStats();
  renderArchive();
}

// ----- Presenter spin: trajectory ends at preSelectedPick -----
// Builds a sequence: cycles through available groups, always ending at preSelectedPick.
// This ensures the last flashing group IS the result — no jump.

function runPresenterSpin(available, preSelectedPick, onStop) {
  const resultIdx = available.indexOf(preSelectedPick);
  const numCycles = 3; // full cycles through the list before landing

  const sequence = [];
  for (let c = 0; c < numCycles; c++) {
    for (let i = 0; i < available.length; i++) {
      sequence.push(available[i]);
    }
  }
  // Final partial cycle: go to result exactly
  for (let i = 0; i <= resultIdx; i++) {
    sequence.push(available[i]);
  }

  playSequence(sequence, onStop);
}

// ----- Generic spin: cycles through items, stopping with pre-determined result -----
// For evaluators, it flashes available evaluator candidates; the final result is
// determined separately but the spin visually cycles through candidates.

function runSpin(items, onStop) {
  // Just cycle through items for a few seconds, caller decides result
  const numCycles = 3;
  const sequence = [];
  for (let c = 0; c < numCycles; c++) {
    for (let i = 0; i < items.length; i++) {
      sequence.push(items[i]);
    }
  }

  playSequence(sequence, onStop);
}

// ----- Shared: play a pre-built sequence at decreasing speed -----

function playSequence(sequence, onStop) {
  let idx = 0;

  function getDelay() {
    // Speed curve: fast start, graceful deceleration
    const progress = idx / sequence.length;
    if (progress < 0.45) return 50;       // fast
    if (progress < 0.70) return 100;      // medium
    if (progress < 0.90) return 200;      // slow
    return 320;                           // very slow (final approach)
  }

  function step() {
    if (idx >= sequence.length) {
      onStop();
      return;
    }

    const g = sequence[idx];
    updateDisplay(g, '第' + g + '组', '');

    // Keep spinning class but don't call renderGrid for spin (performance)
    // Flash highlight the current group in the grid
    renderGrid(g);

    idx++;
    spinTimer = setTimeout(step, getDelay());
  }

  step();
}

// ----- Next Round -----

function nextRound() {
  currentPresenter = null;
  currentEvaluators = [];
  phase = 'idle';

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning', 'result-presenter', 'result-evaluators');
  updateDisplay('?', '准备开始', '');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  renderEvaluatorSlots();

  const avail = getAvailablePresenters();
  if (avail.length === 0) {
    phase = 'complete';
  }

  updateButton();
  updatePhaseIndicator();
  renderGrid();
  renderRoundHistory();
  updateStats();
}

// ===== Reset =====

function resetAll() {
  if (spinning) {
    if (spinTimer) clearTimeout(spinTimer);
    spinning = false;
  }
  rounds = [];
  currentPresenter = null;
  currentEvaluators = [];
  phase = 'idle';
  saveRounds();

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning', 'result-presenter', 'result-evaluators');
  updateDisplay('?', '准备开始', '');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  renderEvaluatorSlots();

  updateButton();
  updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid();
  renderRoundHistory();
  updateStats();
}

// ===== Init =====

function init() {
  rounds = loadRounds();

  // Find in-progress round
  const inProgress = rounds.find(r => r.evaluators.length === 0);
  if (inProgress) {
    currentPresenter = inProgress.presenter;
    currentEvaluators = [];
    phase = 'presenter_done';
  } else if (rounds.length > 0) {
    const last = rounds[rounds.length - 1];
    if (last.evaluators.length > 0) {
      currentPresenter = last.presenter;
      currentEvaluators = last.evaluators;
      phase = 'evaluators_done';
    }
  }

  // Check if all done
  if (phase === 'idle' || phase === 'evaluators_done') {
    const avail = getAvailablePresenters();
    if (avail.length === 0 && rounds.every(r => r.evaluators.length > 0)) {
      phase = 'complete';
    }
  }

  // Restore UI
  switch (phase) {
    case 'presenter_done':
      updateDisplay(currentPresenter, '第' + currentPresenter + '组', 'result-presenter');
      document.getElementById('resultText').style.display = 'block';
      document.getElementById('evaluatorSection').classList.add('visible');
      renderEvaluatorSlots();
      break;
    case 'evaluators_done':
      updateDisplay(currentPresenter, '第' + currentPresenter + '组', 'result-evaluators');
      document.getElementById('resultText').style.display = 'block';
      document.getElementById('evaluatorSection').classList.add('visible');
      renderEvaluatorSlots();
      document.getElementById('evalActionHint').style.display = 'block';
      break;
    case 'complete':
      updateDisplay('!', '全部完成', '');
      break;
    default:
      break;
  }

  updateButton();
  updatePhaseIndicator();
  renderGrid();
  renderRoundHistory();
  updateStats();
  renderArchive();

  if (phase === 'complete') {
    document.getElementById('btnDraw').disabled = true;
  }
}

init();
</script>
