<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抽组演进 — 课堂随机抽组</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes floatGlow {
    0%, 100% { opacity: 0.4; transform: translateY(0); }
    50% { opacity: 0.7; transform: translateY(-6px); }
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0a14 0%, #0f0f24 25%, #0d0d1f 50%, #0a0a1a 75%, #0c0c20 100%);
    background-size: 400% 400%; animation: bgShift 20s ease infinite;
    color: #e8e8f0; min-height: 100vh; display: flex;
    justify-content: center; align-items: flex-start; padding: 24px 16px 60px;
  }

  /* Ambient glow orbs */
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
  }
  body::before {
    width: 500px; height: 500px; background: rgba(99,102,241,0.08);
    top: -150px; left: -100px; animation: floatGlow 8s ease-in-out infinite;
  }
  body::after {
    width: 400px; height: 400px; background: rgba(34,197,94,0.06);
    bottom: -100px; right: -80px; animation: floatGlow 10s ease-in-out infinite reverse;
  }

  .container { max-width: 840px; width: 100%; position: relative; z-index: 1; }

  /* ===== HEADER ===== */
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 40px; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 40%, #a78bfa 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header p { font-size: 16px; color: #6b7280; letter-spacing: 1px; }

  /* ===== PHASE INDICATOR ===== */
  .phase-indicator {
    display: flex; gap: 12px; align-items: center; justify-content: center; margin-bottom: 24px;
  }
  .phase-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.4s ease;
  }
  .phase-dot.active {
    background: #818cf8; border-color: #818cf8;
    box-shadow: 0 0 16px rgba(129,140,248,0.5), 0 0 32px rgba(129,140,248,0.2);
  }
  .phase-dot.done {
    background: #4ade80; border-color: #4ade80;
    box-shadow: 0 0 12px rgba(74,222,128,0.4);
  }
  .phase-label-mini { font-size: 12px; color: #555; margin: 0 6px; letter-spacing: 1px; }

  /* ===== DISPLAY AREA ===== */
  .display-area {
    background: rgba(20,20,40,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: 28px; padding: 44px 32px; text-align: center; margin-bottom: 20px;
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .display-area.spinning {
    border-color: rgba(129,140,248,0.4);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 80px rgba(99,102,241,0.25), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .display-area.result-presenter {
    border-color: rgba(74,222,128,0.3);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 80px rgba(34,197,94,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  .display-area.result-evaluators {
    border-color: rgba(96,165,250,0.3);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 80px rgba(59,130,246,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  /* Shine line across top */
  .display-area::after {
    content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
  }

  .phase-label {
    font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 4px;
    margin-bottom: 12px; font-weight: 600;
  }

  .presenter-display .group-number {
    font-size: 148px; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #c7d2fe 0%, #6366f1 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    filter: drop-shadow(0 0 30px rgba(99,102,241,0.3));
  }
  .display-area.result-presenter .presenter-display .group-number {
    background: linear-gradient(180deg, #bbf7d0 0%, #22c55e 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(34,197,94,0.3));
  }
  .display-area.result-evaluators .presenter-display .group-number {
    background: linear-gradient(180deg, #bfdbfe 0%, #3b82f6 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(59,130,246,0.3));
  }

  .presenter-label { font-size: 17px; color: #9ca3af; margin-top: 8px; font-weight: 500; }

  /* ===== EVALUATOR SECTION ===== */
  .evaluator-section {
    display: none; margin-top: 24px; padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .evaluator-section.visible { display: block; }
  .evaluator-section .section-title { font-size: 14px; color: #6b7280; margin-bottom: 16px; letter-spacing: 1px; }
  .evaluator-slots { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .eval-slot {
    width: 88px; height: 88px; border-radius: 20px;
    background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800; color: rgba(255,255,255,0.15);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .eval-slot.filled {
    background: rgba(59,130,246,0.1); border-color: rgba(96,165,250,0.4); border-style: solid;
    color: #93c5fd; animation: evaluatorReveal 0.5s ease-out;
    box-shadow: 0 0 24px rgba(59,130,246,0.2);
  }
  .eval-slot.revealing {
    border-color: #fbbf24; color: #fbbf24; background: rgba(251,191,36,0.08);
    box-shadow: 0 0 28px rgba(251,191,36,0.4);
    animation: evaluatorReveal 0.5s ease-out;
  }
  @keyframes evaluatorReveal {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-text { display: none; font-size: 20px; color: #4ade80; margin-top: 16px; font-weight: 700; }
  .display-area.result-presenter .result-text { display: block; }
  .eval-action-hint {
    display: none; margin-top: 20px; font-size: 15px; color: #fbbf24; line-height: 1.9;
  }
  .display-area.result-evaluators .eval-action-hint { display: block; }

  /* ===== BUTTONS ===== */
  .btn-row { display: flex; gap: 14px; margin-bottom: 14px; }
  .btn {
    flex: 1; padding: 18px 20px; border: none; border-radius: 16px;
    font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap; letter-spacing: -0.2px; position: relative; overflow: hidden;
  }
  .btn::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent);
    border-radius: 16px 16px 0 0; pointer-events: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { transform: translateY(-1px); }

  .btn-draw {
    background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
    color: #fff; box-shadow: 0 8px 30px rgba(99,102,241,0.35);
  }
  .btn-draw:hover { box-shadow: 0 12px 36px rgba(99,102,241,0.5); transform: translateY(-2px); }
  .btn-draw:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; transform: none; }
  .btn-draw.drawing {
    background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
    box-shadow: 0 8px 30px rgba(239,68,68,0.35);
  }
  .btn-draw.drawing:hover { box-shadow: 0 12px 36px rgba(239,68,68,0.5); }
  .btn-draw.next-round {
    background: linear-gradient(135deg, #22c55e 0%, #059669 100%);
    box-shadow: 0 8px 30px rgba(34,197,94,0.35);
  }
  .btn-draw.next-round:hover { box-shadow: 0 12px 36px rgba(34,197,94,0.5); }

  .btn-next {
    flex: 0.28; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
    color: #9ca3af; font-size: 15px; backdrop-filter: blur(10px);
  }
  .btn-next:hover { border-color: rgba(74,222,128,0.4); color: #4ade80; background: rgba(74,222,128,0.05); }

  .btn-reset {
    background: transparent; border: 1px solid rgba(255,255,255,0.05);
    color: #555; font-size: 14px; padding: 12px; width: 100%; border-radius: 14px;
    cursor: pointer; transition: all 0.3s;
  }
  .btn-reset:hover { border-color: rgba(239,68,68,0.4); color: #ef4444; }

  /* ===== SOUND TOGGLE ===== */
  .sound-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 100;
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(20,20,40,0.7); backdrop-filter: blur(10px);
    color: #888; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .sound-toggle:hover { border-color: rgba(129,140,248,0.5); color: #a5b4fc; }
  .sound-toggle.muted { color: #444; }

  /* ===== GROUP GRID ===== */
  .group-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px; }
  .group-card {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 18px; font-size: 28px; font-weight: 800;
    background: rgba(20,20,40,0.6); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.05);
    color: #aaa; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; cursor: default;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .group-card:hover { border-color: rgba(255,255,255,0.1); background: rgba(30,30,55,0.6); }
  .group-card small {
    font-size: 12px; font-weight: 500; color: #6b7280; margin-top: 4px;
    max-width: 82%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .group-card .badge {
    display: none; position: absolute; top: 8px; right: 8px;
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
    line-height: 1; letter-spacing: 0.5px;
  }

  /* Presenter */
  .group-card.is-presenter {
    background: rgba(34,197,94,0.12); border-color: rgba(74,222,128,0.5); color: #4ade80;
    box-shadow: 0 0 36px rgba(34,197,94,0.25), 0 4px 16px rgba(0,0,0,0.2);
    animation: presenterPulse 2s ease-in-out infinite;
  }
  @keyframes presenterPulse {
    0%, 100% { box-shadow: 0 0 36px rgba(34,197,94,0.25), 0 4px 16px rgba(0,0,0,0.2); }
    50% { box-shadow: 0 0 56px rgba(34,197,94,0.4), 0 4px 16px rgba(0,0,0,0.2); }
  }
  .group-card.is-presenter .badge { display: block; background: #22c55e; color: #000; }

  /* Evaluator */
  .group-card.is-evaluator {
    background: rgba(59,130,246,0.12); border-color: rgba(96,165,250,0.4); color: #93c5fd;
    box-shadow: 0 0 28px rgba(59,130,246,0.2), 0 4px 16px rgba(0,0,0,0.2);
  }
  .group-card.is-evaluator .badge { display: block; background: #3b82f6; color: #fff; }

  /* Done */
  .group-card.is-done {
    background: rgba(255,255,255,0.02); border-color: rgba(255,255,255,0.03); color: #444;
  }
  .group-card.is-done::after {
    content: '✓'; position: absolute; top: 8px; right: 12px; font-size: 14px; color: #3a3a4a; font-weight: 600;
  }

  /* Spin highlight */
  .group-card.spin-active {
    border-color: #fbbf24 !important; color: #fbbf24 !important;
    background: rgba(251,191,36,0.1) !important;
    box-shadow: 0 0 40px rgba(251,191,36,0.4), 0 4px 16px rgba(0,0,0,0.2) !important;
    transform: scale(1.08); z-index: 2;
  }

  /* ===== STATS ===== */
  .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .stats .remaining { font-size: 14px; color: #6b7280; }
  .stats .remaining span { color: #818cf8; font-weight: 700; font-size: 18px; }

  /* ===== HISTORY ===== */
  .history {
    background: rgba(20,20,40,0.6); backdrop-filter: blur(10px);
    border-radius: 18px; padding: 22px; margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,0.04);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .history h3 { font-size: 15px; color: #6b7280; margin-bottom: 16px; letter-spacing: 1px; }
  .history-list { display: flex; flex-direction: column; gap: 10px; min-height: 20px; }
  .history-list .empty { color: #444; font-size: 15px; text-align: center; padding: 12px 0; }
  .round-card {
    background: rgba(255,255,255,0.02); border-radius: 12px; padding: 14px 18px;
    border-left: 3px solid rgba(74,222,128,0.5); font-size: 15px; line-height: 1.7;
    transition: all 0.3s;
  }
  .round-card:hover { background: rgba(255,255,255,0.04); }
  .round-card .round-num { font-weight: 700; color: #4ade80; }
  .round-card .presenter-name { color: #86efac; font-weight: 600; }
  .round-card .eval-names { color: #93c5fd; }
  .round-card .arrow { color: #444; margin: 0 8px; }

  /* ===== ARCHIVE ===== */
  .archive-panel {
    display: none; background: rgba(20,20,40,0.6); backdrop-filter: blur(10px);
    border-radius: 18px; padding: 22px; margin-bottom: 14px;
    border: 1px solid rgba(129,140,248,0.2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .archive-panel.visible { display: block; }
  .archive-panel h3 { font-size: 15px; color: #818cf8; margin-bottom: 16px; letter-spacing: 1px; }
  .archive-item {
    background: rgba(255,255,255,0.02); border-radius: 10px; padding: 12px 16px;
    margin-bottom: 8px; font-size: 14px; line-height: 1.6;
    border-left: 2px solid rgba(129,140,248,0.3);
    transition: all 0.3s;
  }
  .archive-item:hover { background: rgba(255,255,255,0.04); }
  .archive-item .time { color: #555; font-size: 12px; }
  .archive-item .detail { color: #d1d5db; }
  .archive-empty { color: #444; font-size: 14px; text-align: center; padding: 16px 0; }

  .btn-archive {
    width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.05); border-radius: 14px;
    background: rgba(20,20,40,0.4); color: #6b7280; font-size: 15px; cursor: pointer;
    margin-bottom: 14px; transition: all 0.3s; backdrop-filter: blur(10px);
  }
  .btn-archive:hover {
    border-color: rgba(129,140,248,0.3); color: #a5b4fc;
    background: rgba(30,30,55,0.5);
  }
  .btn-clear-archive {
    background: transparent; border: none; color: rgba(239,68,68,0.6); font-size: 13px;
    cursor: pointer; padding: 4px 8px; float: right; transition: all 0.3s;
  }
  .btn-clear-archive:hover { color: #ef4444; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    body { padding: 12px 8px 40px; }
    body::before, body::after { display: none; }
    .container { max-width: 100%; }
    .header h1 { font-size: 28px; }
    .presenter-display .group-number { font-size: 92px; }
    .group-grid { gap: 8px; }
    .group-card { font-size: 18px; border-radius: 14px; }
    .group-card small { font-size: 10px; }
    .group-card .badge { font-size: 8px; padding: 2px 6px; }
    .btn { font-size: 16px; padding: 14px 10px; }
    .eval-slot { width: 60px; height: 60px; font-size: 24px; }
    .display-area { padding: 28px 16px; border-radius: 22px; }
  }
</style>
</head>
<body>

<!-- Sound toggle -->
<button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="音效开关">&#128264;</button>

<div class="container">
  <div class="header">
    <h1>&#127919; 抽组演进</h1>
    <p>抽汇报组 → 逐个抽 4 组点评</p>
  </div>

  <div class="phase-indicator">
    <div class="phase-dot active" id="phaseDot1"></div>
    <span class="phase-label-mini">汇报</span>
    <span style="color:#333;">→</span>
    <div class="phase-dot" id="phaseDot2"></div>
    <span class="phase-label-mini">点评</span>
  </div>

  <div class="display-area" id="displayArea">
    <div class="presenter-display">
      <div class="phase-label">汇报组</div>
      <div class="group-number" id="displayPresenter">?</div>
      <div class="presenter-label" id="displayLabel">准备开始</div>
    </div>
    <div class="result-text" id="resultText">&#127942; 请上台汇报！</div>

    <div class="evaluator-section" id="evaluatorSection">
      <div class="section-title" id="evalSectionTitle">点评组（逐个抽取）</div>
      <div class="evaluator-slots" id="evaluatorSlots">
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
        <div class="eval-slot">?</div>
      </div>
      <div class="eval-action-hint" id="evalActionHint">
        &#9200; 各组讨论 2~3 分钟，派代表上台点评<br>
        &#128172; 点评后汇报组可回应，双向交流
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-draw" id="btnDraw" onclick="toggleDraw()">开始抽取汇报组</button>
    <button class="btn btn-next" id="btnNext" onclick="clickNextRound()" style="display:none;">下一组</button>
  </div>

  <div class="group-grid" id="groupGrid"></div>

  <div class="stats">
    <div class="remaining">待汇报 <span id="remainingCount">10</span> 组</div>
    <div class="remaining" style="color:#888;">已完成 <span id="completedRounds" style="color:#22c55e;font-weight:700;">0</span> 轮</div>
  </div>

  <div class="history">
    <h3>&#128214; 本轮抽取记录</h3>
    <div class="history-list" id="historyList">
      <span class="empty">尚未抽取</span>
    </div>
  </div>

  <button class="btn-archive" id="btnArchive" onclick="toggleArchive()">
    &#128451; 查看全部抽签记录（<span id="archiveCount">0</span> 条历史）
  </button>
  <div class="archive-panel" id="archivePanel">
    <h3>&#128451; 全部抽签记录（持久保存）</h3>
    <button class="btn-clear-archive" onclick="clearArchive()">清空记录</button>
    <div id="archiveList"></div>
  </div>

  <div class="btn-row" style="margin-top: 4px;">
    <button class="btn btn-reset" id="btnReset" onclick="resetAll()">重置本轮（历史记录保留）</button>
  </div>
</div>

<script>
const TOTAL = 10;
const EVAL_COUNT = 4;
const PRE_DRAWN = [1, 3, 6]; // 上次课已抽过的组

const GROUP_NAMES = {
  1: 'AI谄媚与推理', 2: '隐私信息均衡', 3: 'AI共情抑制',
  4: '人机协同学习', 5: 'AI美育干预', 6: '病毒传播教育',
  7: 'AI失真批判', 8: 'AI模拟教学', 9: 'AI幻觉免疫', 10: '绘本戏剧干预'
};

let rounds = [];            // [{presenter:N, evaluators:[a,b,c,d]}, ...]
let currentPresenter = null;
let currentEvaluators = []; // filled one at a time
let phase = 'idle';
let spinning = false;
let spinTimer = null;
let preSelectedEvaluators = []; // all 4 pre-selected, revealed one-by-one
let soundEnabled = true;

// ===== Sound Engine =====

let audioCtx = null;
function getCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  return audioCtx;
}

function playTick() {
  if (!soundEnabled) return;
  try {
    const ctx = getCtx(); if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 600 + Math.random() * 500;
    o.type = 'sine';
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
    o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.04);
  } catch(e) {}
}

function playReveal() {
  if (!soundEnabled) return;
  try {
    const ctx = getCtx(); if (!ctx) return;
    [523, 659, 784].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'sine';
      const t = ctx.currentTime + i * 0.1;
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.start(t); o.stop(t + 0.25);
    });
  } catch(e) {}
}

function playFinish() {
  if (!soundEnabled) return;
  try {
    const ctx = getCtx(); if (!ctx) return;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = f; o.type = 'triangle';
      const t = ctx.currentTime + i * 0.15;
      g.gain.setValueAtTime(0.1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      o.start(t); o.stop(t + 0.4);
    });
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').innerHTML = soundEnabled ? '&#128264;' : '&#128263;';
  if (soundEnabled) document.getElementById('soundToggle').classList.remove('muted');
  else document.getElementById('soundToggle').classList.add('muted');
  localStorage.setItem('group_sound_enabled', soundEnabled ? '1' : '0');
}

// ===== Persistence =====

function loadRounds() {
  try {
    const raw = localStorage.getItem('group_rounds_v2');
    if (raw) return JSON.parse(raw);
    const old = localStorage.getItem('group_pick_history');
    if (old) {
      const h = JSON.parse(old);
      if (Array.isArray(h) && h.length > 0 && typeof h[0] === 'number')
        return h.map(p => ({presenter: p, evaluators: []}));
      if (Array.isArray(h) && h.length > 0 && h[0].presenter) return h;
    }
    return [];
  } catch(e) { return []; }
}

function saveRounds() {
  localStorage.setItem('group_rounds_v2', JSON.stringify(rounds));
}

function loadArchive() {
  try { return JSON.parse(localStorage.getItem('group_rounds_archive') || '[]'); } catch(e) { return []; }
}

function saveArchiveEntry(entry) {
  const archive = loadArchive();
  archive.push(entry);
  localStorage.setItem('group_rounds_archive', JSON.stringify(archive));
}

function updateArchiveLast(updater) {
  const archive = loadArchive();
  if (archive.length > 0) { updater(archive[archive.length - 1]); }
  localStorage.setItem('group_rounds_archive', JSON.stringify(archive));
}

function clearArchive() {
  if (confirm('确定清空全部抽签历史记录吗？')) {
    localStorage.removeItem('group_rounds_archive');
    renderArchive();
  }
}

function renderArchive() {
  const archive = loadArchive();
  document.getElementById('archiveCount').textContent = archive.length;
  const list = document.getElementById('archiveList');
  if (archive.length === 0) {
    list.innerHTML = '<div class="archive-empty">暂无历史记录</div>'; return;
  }
  list.innerHTML = archive.slice().reverse().map(e => {
    const d = new Date(e.timestamp);
    const ts = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    const es = e.evaluators.length > 0 ? ' → 第'+e.evaluators.join('、')+'组 点评' : '（未抽点评组）';
    return '<div class="archive-item"><span class="detail"><b style="color:#4ade80;">第'+e.presenter+'组</b> 汇报'+es+'</span> <span class="time">'+ts+'</span></div>';
  }).join('');
}

function toggleArchive() {
  const panel = document.getElementById('archivePanel');
  panel.classList.toggle('visible');
  if (panel.classList.contains('visible')) renderArchive();
}

// ===== State helpers =====

function getPresentedSet() {
  // 硬编码：1、3、6 组在上次课已汇报，永不在候选池中
  return new Set([...rounds.map(r => r.presenter), ...PRE_DRAWN]);
}

function getAvailablePresenters() {
  const done = getPresentedSet();
  const avail = [];
  for (let i = 1; i <= TOTAL; i++) if (!done.has(i)) avail.push(i);
  return avail;
}

function getAvailableEvaluators() {
  const avail = [];
  for (let i = 1; i <= TOTAL; i++) {
    if (i !== currentPresenter && !currentEvaluators.includes(i)) avail.push(i);
  }
  return avail;
}

function getAllPreviousEvaluators() {
  const s = new Set();
  rounds.forEach(r => r.evaluators.forEach(e => s.add(e)));
  return s;
}

// ===== Evaluator pre-selection (≥3 fresh across rounds) =====

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function preSelectAllEvaluators() {
  const available = getAvailableEvaluators();
  const allPrev = getAllPreviousEvaluators();
  const fresh = available.filter(g => !allPrev.has(g));

  const picked = [];
  const shuffledFresh = shuffle(fresh);
  picked.push(...shuffledFresh.slice(0, 3));

  const rest = available.filter(g => !picked.includes(g));
  const shuffledRest = shuffle(rest);
  while (picked.length < EVAL_COUNT) picked.push(shuffledRest.shift());

  // 打乱揭晓顺序，避免每次都是小号先出
  return shuffle(picked);
}

// ===== Rendering =====

function renderGrid(spinHighlight) {
  const grid = document.getElementById('groupGrid');
  const presented = getPresentedSet();
  const evalSet = new Set(currentEvaluators);
  let html = '';
  for (let i = 1; i <= TOTAL; i++) {
    let cls = 'group-card', badge = '';
    if (i === currentPresenter) { cls += ' is-presenter'; badge = '<span class="badge">汇报</span>'; }
    else if (evalSet.has(i)) { cls += ' is-evaluator'; badge = '<span class="badge">点评</span>'; }
    else if (presented.has(i) && i !== currentPresenter) { cls += ' is-done'; }

    if (spinHighlight === i && i !== currentPresenter && !evalSet.has(i)) cls += ' spin-active';

    html += '<div class="'+cls+'">'+badge+i+'<small>'+(GROUP_NAMES[i]||'第'+i+'组')+'</small></div>';
  }
  grid.innerHTML = html;
}

function renderEvaluatorSlots(revealingIdx) {
  const slots = document.getElementById('evaluatorSlots');
  let html = '';
  for (let i = 0; i < EVAL_COUNT; i++) {
    const val = currentEvaluators[i] || null;
    let cls = 'eval-slot';
    if (val) cls += ' filled';
    if (i === revealingIdx) cls += ' revealing';
    html += '<div class="'+cls+'">'+(val||'?')+'</div>';
  }
  slots.innerHTML = html;
}

function renderRoundHistory() {
  const list = document.getElementById('historyList');
  if (rounds.length === 0) { list.innerHTML = '<span class="empty">尚未抽取</span>'; return; }
  list.innerHTML = rounds.map((r, i) => {
    const es = r.evaluators.length > 0 ? '<span class="eval-names">第'+r.evaluators.join('、')+'组</span>' : '<span style="color:#666;">未抽点评组</span>';
    return '<div class="round-card"><span class="round-num">第'+(i+1)+'轮</span> <span class="presenter-name">第'+r.presenter+'组</span> 汇报<span class="arrow">→</span>'+es+' 点评</div>';
  }).join('');
}

function updateStats() {
  document.getElementById('remainingCount').textContent = TOTAL - getPresentedSet().size;
  document.getElementById('completedRounds').textContent = rounds.filter(r => r.evaluators.length >= EVAL_COUNT).length;
}

function updatePhaseIndicator() {
  const d1 = document.getElementById('phaseDot1'), d2 = document.getElementById('phaseDot2');
  d1.classList.remove('active','done'); d2.classList.remove('active','done');
  if (phase === 'idle' || phase === 'drawing_presenter') d1.classList.add('active');
  else if (phase === 'presenter_done' || phase === 'drawing_evaluator' || phase === 'evaluator_partial') { d1.classList.add('done'); d2.classList.add('active'); }
  else { d1.classList.add('done'); d2.classList.add('done'); }
}

function updateDisplay(num, label, cls) {
  document.getElementById('displayPresenter').textContent = num;
  document.getElementById('displayLabel').textContent = label;
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning','result-presenter','result-evaluators');
  if (cls) area.classList.add(cls);
}

// ===== Button =====

function updateButton() {
  const btn = document.getElementById('btnDraw');
  const btnNext = document.getElementById('btnNext');
  btn.classList.remove('drawing','next-round');
  btn.disabled = false;
  btnNext.style.display = 'none';

  const drawn = currentEvaluators.length;

  switch (phase) {
    case 'idle':
      btn.textContent = '开始抽取汇报组';
      break;
    case 'drawing_presenter':
      btn.textContent = '停止抽取'; btn.classList.add('drawing');
      break;
    case 'presenter_done':
    case 'evaluator_partial':
      btn.textContent = '抽取点评 ('+(drawn+1)+'/'+EVAL_COUNT+')';
      btnNext.textContent = '下一组';
      btnNext.style.display = 'block';
      break;
    case 'drawing_evaluator':
      btn.textContent = '停止抽取'; btn.classList.add('drawing');
      break;
    case 'evaluators_done': {
      const avail = getAvailablePresenters();
      btn.textContent = avail.length > 0 ? '下一轮（抽汇报组）' : '全部完成！';
      if (avail.length === 0) btn.disabled = true;
      else btn.classList.add('next-round');
      break;
    }
    case 'complete':
      btn.textContent = '全部完成！'; btn.disabled = true;
      break;
  }
}

// ===== Main toggle =====

function toggleDraw() {
  switch (phase) {
    case 'idle':             startDrawPresenter(); break;
    case 'drawing_presenter': stopDrawPresenter(); break;
    case 'presenter_done':
    case 'evaluator_partial': startDrawOneEvaluator(); break;
    case 'drawing_evaluator': stopDrawEvaluator(); break;
    case 'evaluators_done':   nextRound(); break;
    case 'complete':          break;
  }
}

// ===== Draw Presenter =====

function startDrawPresenter() {
  const available = getAvailablePresenters();
  if (available.length === 0) { phase = 'complete'; updateDisplay('!','所有小组已汇报完毕',''); updateButton(); updatePhaseIndicator(); return; }

  spinning = true; currentPresenter = null; currentEvaluators = []; preSelectedEvaluators = [];
  phase = 'drawing_presenter';
  updateButton(); updatePhaseIndicator();
  document.getElementById('btnReset').disabled = true;

  const area = document.getElementById('displayArea');
  area.classList.remove('result-presenter','result-evaluators'); area.classList.add('spinning');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  updateDisplay('?','正在抽取汇报组...','');

  // First draw ever → Group 1; otherwise random
  const isFirstEver = rounds.length === 0 && loadArchive().length === 0;
  const pick = isFirstEver ? 1 : available[Math.floor(Math.random() * available.length)];

  runSpin(available, pick, () => stopDrawPresenter(pick));
}

function stopDrawPresenter(pick) {
  spinning = false; if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }
  currentPresenter = pick; currentEvaluators = []; preSelectedEvaluators = [];
  phase = 'presenter_done';
  rounds.push({presenter: pick, evaluators: []}); saveRounds();
  saveArchiveEntry({presenter: pick, evaluators: [], timestamp: new Date().toISOString()});

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning'); area.classList.add('result-presenter');
  updateDisplay(pick, '第'+pick+'组', 'result-presenter');
  document.getElementById('resultText').style.display = 'block';
  document.getElementById('evaluatorSection').classList.add('visible');
  renderEvaluatorSlots();

  playReveal();
  updateButton(); updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid(); renderRoundHistory(); updateStats(); renderArchive();

  // Pre-select evaluators (will be revealed one by one)
  preSelectedEvaluators = preSelectAllEvaluators();
}

// ===== Draw One Evaluator =====

function startDrawOneEvaluator() {
  const drawn = currentEvaluators.length;
  if (drawn >= EVAL_COUNT) return;

  // If first draw, pre-select (may already be done in stopDrawPresenter)
  if (preSelectedEvaluators.length === 0) {
    preSelectedEvaluators = preSelectAllEvaluators();
  }

  spinning = true; phase = 'drawing_evaluator';
  updateButton(); updatePhaseIndicator();
  document.getElementById('btnReset').disabled = true;

  const area = document.getElementById('displayArea');
  area.classList.remove('result-presenter','result-evaluators'); area.classList.add('spinning');
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evalSectionTitle').textContent = '点评组（'+(drawn+1)+'/'+EVAL_COUNT+'）';
  updateDisplay(currentPresenter, '正在抽取点评组 ('+(drawn+1)+'/'+EVAL_COUNT+')...', '');

  // Spin through ALL available evaluator candidates
  const candidates = getAvailableEvaluators();
  runSpin(candidates, preSelectedEvaluators[drawn], () => revealOneEvaluator(preSelectedEvaluators[drawn]));
}

function revealOneEvaluator(g) {
  spinning = false; if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }

  currentEvaluators.push(g);
  const drawn = currentEvaluators.length;

  // Update round data
  const lastRound = rounds[rounds.length - 1];
  if (lastRound && lastRound.presenter === currentPresenter) lastRound.evaluators = [...currentEvaluators];
  saveRounds();
  updateArchiveLast(a => { a.evaluators = [...currentEvaluators]; a.timestamp = new Date().toISOString(); });

  if (drawn >= EVAL_COUNT) {
    phase = 'evaluators_done';
    const area = document.getElementById('displayArea');
    area.classList.remove('spinning'); area.classList.add('result-evaluators');
    updateDisplay(currentPresenter, '第'+currentPresenter+'组', 'result-evaluators');
    document.getElementById('resultText').style.display = 'block';
    document.getElementById('evalSectionTitle').textContent = '点评组（全部抽完）';
    renderEvaluatorSlots();
    setTimeout(() => { document.getElementById('evalActionHint').style.display = 'block'; }, 800);
    playFinish();
  } else {
    phase = 'evaluator_partial';
    updateDisplay(currentPresenter, '第'+currentPresenter+'组', 'result-presenter');
    document.getElementById('resultText').style.display = 'block';
    document.getElementById('evalSectionTitle').textContent = '点评组（已抽 '+drawn+'/'+EVAL_COUNT+'）';
    renderEvaluatorSlots();
    playReveal();
  }

  updateButton(); updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid(); renderRoundHistory(); updateStats(); renderArchive();
}

function stopDrawEvaluator() {
  // Not used in one-at-a-time mode (auto-stop via runSpin), kept for symmetry
}

// ===== Spin Engine =====

function runSpin(items, target, onStop) {
  const targetIdx = items.indexOf(target);
  const cycles = 3;
  const seq = [];
  for (let c = 0; c < cycles; c++) for (let i = 0; i < items.length; i++) seq.push(items[i]);
  for (let i = 0; i <= targetIdx; i++) seq.push(items[i]);

  let idx = 0;
  function getDelay() {
    const p = idx / seq.length;
    if (p < 0.45) return 50;
    if (p < 0.70) return 110;
    if (p < 0.90) return 220;
    return 350;
  }

  function step() {
    if (idx >= seq.length) { onStop(); return; }
    const g = seq[idx];
    updateDisplay(g, '第'+g+'组', '');
    renderGrid(g);
    playTick();
    idx++;
    spinTimer = setTimeout(step, getDelay());
  }
  step();
}

// ===== Next Round =====

// "下一组" 按钮 — 跳过剩余点评，直接进入下一轮
function clickNextRound() {
  if (spinning) return;
  // 当前轮次已有 evaluators 数据已在 revealOneEvaluator 中保存
  nextRound();
}

function nextRound() {
  currentPresenter = null; currentEvaluators = []; preSelectedEvaluators = [];
  phase = 'idle';
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning','result-presenter','result-evaluators');
  updateDisplay('?','准备开始','');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  renderEvaluatorSlots();
  if (getAvailablePresenters().length === 0) phase = 'complete';
  updateButton(); updatePhaseIndicator();
  renderGrid(); renderRoundHistory(); updateStats();
}

// ===== Reset =====

function resetAll() {
  if (spinning) { if (spinTimer) clearTimeout(spinTimer); spinning = false; }
  rounds = []; currentPresenter = null; currentEvaluators = []; preSelectedEvaluators = [];
  phase = 'idle'; saveRounds();
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning','result-presenter','result-evaluators');
  updateDisplay('?','准备开始','');
  document.getElementById('resultText').style.display = 'none';
  document.getElementById('evalActionHint').style.display = 'none';
  document.getElementById('evaluatorSection').classList.remove('visible');
  document.getElementById('evalSectionTitle').textContent = '点评组（逐个抽取）';
  renderEvaluatorSlots();
  updateButton(); updatePhaseIndicator();
  document.getElementById('btnReset').disabled = false;
  renderGrid(); renderRoundHistory(); updateStats();
}

// ===== Init =====

function init() {
  rounds = loadRounds();

  // Sound prefs
  try { soundEnabled = localStorage.getItem('group_sound_enabled') !== '0'; } catch(e) { soundEnabled = true; }
  if (!soundEnabled) { document.getElementById('soundToggle').innerHTML = '&#128263;'; document.getElementById('soundToggle').classList.add('muted'); }

  // Always ensure 1,3,6 are marked as presented (never in presenter pool)
  const didPresent = new Set(rounds.map(r => r.presenter));
  const archiveCheck = loadArchive();
  let changed = false;
  PRE_DRAWN.forEach(g => {
    if (!didPresent.has(g)) {
      rounds.unshift({presenter: g, evaluators: []});
      changed = true;
      if (!archiveCheck.some(a => a.presenter === g)) {
        saveArchiveEntry({presenter: g, evaluators: [], timestamp: new Date('2026-06-05').toISOString()});
      }
    }
  });
  if (changed) saveRounds();

  // Restore state
  const inProgress = rounds.find(r => r.evaluators.length === 0);
  if (inProgress) {
    currentPresenter = inProgress.presenter; currentEvaluators = [];
    phase = 'presenter_done';
  } else if (rounds.length > 0) {
    const last = rounds[rounds.length - 1];
    if (last.evaluators.length > 0 && last.evaluators.length < EVAL_COUNT) {
      currentPresenter = last.presenter; currentEvaluators = [...last.evaluators];
      phase = 'evaluator_partial';
    } else if (last.evaluators.length >= EVAL_COUNT) {
      currentPresenter = last.presenter; currentEvaluators = [...last.evaluators];
      phase = 'evaluators_done';
    }
  }

  if (getAvailablePresenters().length === 0 && rounds.every(r => r.evaluators.length >= EVAL_COUNT)) phase = 'complete';

  // Restore UI
  switch (phase) {
    case 'presenter_done':
      updateDisplay(currentPresenter, '第'+currentPresenter+'组', 'result-presenter');
      document.getElementById('resultText').style.display = 'block';
      document.getElementById('evaluatorSection').classList.add('visible');
      renderEvaluatorSlots();
      break;
    case 'evaluator_partial':
      updateDisplay(currentPresenter, '第'+currentPresenter+'组', 'result-presenter');
      document.getElementById('resultText').style.display = 'block';
      document.getElementById('evaluatorSection').classList.add('visible');
      document.getElementById('evalSectionTitle').textContent = '点评组（已抽 '+currentEvaluators.length+'/'+EVAL_COUNT+'）';
      renderEvaluatorSlots();
      break;
    case 'evaluators_done':
      updateDisplay(currentPresenter, '第'+currentPresenter+'组', 'result-evaluators');
      document.getElementById('resultText').style.display = 'block';
      document.getElementById('evaluatorSection').classList.add('visible');
      document.getElementById('evalSectionTitle').textContent = '点评组（全部抽完）';
      renderEvaluatorSlots();
      document.getElementById('evalActionHint').style.display = 'block';
      break;
    case 'complete': updateDisplay('!','全部完成',''); break;
    default: break;
  }

  updateButton(); updatePhaseIndicator();
  renderGrid(); renderRoundHistory(); updateStats(); renderArchive();
  if (phase === 'complete') document.getElementById('btnDraw').disabled = true;
}

init();
