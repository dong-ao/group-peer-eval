<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>抽组演进 — 课堂随机抽组</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f0f1a; color: #e0e0e0; min-height: 100vh; display: flex;
    justify-content: center; align-items: center; padding: 16px;
  }
  .container { max-width: 480px; width: 100%; }

  /* Header */
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 26px; color: #fff; }
  .header p { font-size: 14px; color: #888; margin-top: 6px; }

  /* Main display */
  .display-area {
    background: #1a1a2e; border-radius: 20px; padding: 32px 20px;
    text-align: center; margin-bottom: 20px; position: relative; overflow: hidden;
    border: 2px solid #2a2a4a;
  }
  .display-area.spinning { border-color: #6366f1; box-shadow: 0 0 40px rgba(99,102,241,0.3); }
  .display-area.result { border-color: #22c55e; box-shadow: 0 0 40px rgba(34,197,94,0.3); }

  .group-number {
    font-size: 96px; font-weight: 800; color: #6366f1; line-height: 1;
    transition: color 0.3s, transform 0.1s;
  }
  .display-area.result .group-number { color: #22c55e; }
  .group-label { font-size: 18px; color: #aaa; margin-top: 8px; }

  .result-text {
    display: none; font-size: 16px; color: #22c55e; margin-top: 12px; font-weight: 600;
  }
  .display-area.result .result-text { display: block; }

  /* Button */
  .btn-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .btn {
    flex: 1; padding: 16px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-draw {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; box-shadow: 0 6px 24px rgba(99,102,241,0.4);
  }
  .btn-draw:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .btn-draw.drawing {
    background: linear-gradient(135deg, #ef4444, #f97316);
    box-shadow: 0 6px 24px rgba(239,68,68,0.4);
  }
  .btn-reset {
    background: transparent; border: 2px solid #3a3a5a; color: #aaa; font-size: 15px;
  }
  .btn-reset:hover { border-color: #ef4444; color: #ef4444; }

  /* Group grid */
  .group-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
  }
  .group-card {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 14px; font-size: 22px; font-weight: 700;
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #ccc;
    transition: all 0.3s; position: relative; cursor: default;
  }
  .group-card small { font-size: 11px; font-weight: 400; color: #888; margin-top: 2px; }
  .group-card.picked {
    background: #1a2e1a; border-color: #166534; color: #4ade80;
  }
  .group-card.picked::after {
    content: '✓'; position: absolute; top: 6px; right: 10px;
    font-size: 14px; color: #4ade80;
  }
  .group-card.flash {
    background: #2a2a4a; border-color: #6366f1; color: #fff;
    box-shadow: 0 0 24px rgba(99,102,241,0.6);
    transform: scale(1.05);
  }
  .group-card.current {
    background: #1a3320; border-color: #22c55e; color: #4ade80;
    box-shadow: 0 0 24px rgba(34,197,94,0.5);
    animation: pulse 0.8s ease-in-out 3;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* Stats */
  .stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .stats .remaining { font-size: 14px; color: #888; }
  .stats .remaining span { color: #6366f1; font-weight: 700; font-size: 18px; }

  /* History */
  .history { background: #1a1a2e; border-radius: 14px; padding: 16px; }
  .history h3 { font-size: 14px; color: #888; margin-bottom: 12px; }
  .history-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 24px; align-items: center; }
  .history-list .empty { color: #555; font-size: 14px; }
  .history-tag {
    display: inline-flex; align-items: center; gap: 4px;
    background: #1a2e1a; border: 1px solid #166534; border-radius: 20px;
    padding: 6px 14px; font-size: 14px; font-weight: 600; color: #4ade80;
  }
  .history-tag .order { font-size: 11px; color: #888; }

  @media (max-width: 380px) {
    .group-number { font-size: 72px; }
    .btn { font-size: 16px; padding: 14px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🎯 抽组演进</h1>
    <p>随机抽取小组进行课堂演示</p>
  </div>

  <!-- Main display -->
  <div class="display-area" id="displayArea">
    <div class="group-number" id="displayNumber">?</div>
    <div class="group-label" id="displayLabel">准备开始</div>
    <div class="result-text" id="resultText">🎉 请上台演示！</div>
  </div>

  <!-- Buttons -->
  <div class="btn-row">
    <button class="btn btn-draw" id="btnDraw" onclick="toggleDraw()">开始抽取</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-reset" id="btnReset" onclick="resetAll()">重置</button>
  </div>

  <!-- Group grid -->
  <div class="group-grid" id="groupGrid"></div>

  <!-- Stats -->
  <div class="stats">
    <div class="remaining">剩余 <span id="remainingCount">9</span> 组</div>
  </div>

  <!-- History -->
  <div class="history">
    <h3>抽取顺序</h3>
    <div class="history-list" id="historyList">
      <span class="empty">尚未抽取</span>
    </div>
  </div>
</div>

<script>
const TOTAL = 9;
let history = [];
let spinning = false;
let spinTimer = null;
let flashTimer = null;
let pickedGroup = null;

function loadHistory() {
  try {
    const raw = localStorage.getItem('group_pick_history');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

function saveHistory() {
  localStorage.setItem('group_pick_history', JSON.stringify(history));
}

function getAvailable() {
  const picked = new Set(history);
  const avail = [];
  for (let i = 1; i <= TOTAL; i++) {
    if (!picked.has(i)) avail.push(i);
  }
  return avail;
}

function renderGrid(flashGroup) {
  const grid = document.getElementById('groupGrid');
  const picked = new Set(history);
  let html = '';
  for (let i = 1; i <= TOTAL; i++) {
    let cls = 'group-card';
    if (i === pickedGroup) cls += ' current';
    else if (picked.has(i)) cls += ' picked';
    else if (i === flashGroup) cls += ' flash';
    html += '<div class="' + cls + '">' + i + '<small>第' + i + '组</small></div>';
  }
  grid.innerHTML = html;
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (history.length === 0) {
    list.innerHTML = '<span class="empty">尚未抽取</span>';
  } else {
    list.innerHTML = history.map((g, i) =>
      '<span class="history-tag"><span class="order">#' + (i + 1) + '</span> 第' + g + '组</span>'
    ).join('');
    if (history.length === TOTAL) {
      list.innerHTML += '<span style="color:#22c55e;font-size:14px;margin-left:4px;">✅ 全部抽完</span>';
    }
  }
  document.getElementById('remainingCount').textContent = TOTAL - history.length;
}

function updateDisplay(number, label, cls) {
  document.getElementById('displayNumber').textContent = number;
  document.getElementById('displayLabel').textContent = label;
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning', 'result');
  if (cls) area.classList.add(cls);
}

function toggleDraw() {
  if (spinning) { stopDraw(); return; }
  startDraw();
}

function startDraw() {
  const available = getAvailable();
  if (available.length === 0) {
    updateDisplay('!', '所有小组已抽完，请重置', '');
    return;
  }

  spinning = true;
  pickedGroup = null;
  const btn = document.getElementById('btnDraw');
  btn.textContent = '停止抽取';
  btn.classList.add('drawing');
  btn.disabled = false;
  document.getElementById('btnReset').disabled = true;

  const area = document.getElementById('displayArea');
  area.classList.add('spinning');
  document.getElementById('resultText').style.display = 'none';

  // Phase 1: fast cycling (0-1.5s, 60ms)
  // Phase 2: slow down (1.5-2.5s, 120ms)
  // Phase 3: slower (2.5-3.5s, 250ms)
  // Phase 4: stop at 4s

  let phase = 1;
  let flashIdx = 0;
  const startTime = Date.now();

  function cycle() {
    const elapsed = Date.now() - startTime;

    if (elapsed < 1500) {
      phase = 1;
    } else if (elapsed < 2500) {
      phase = 2;
    } else if (elapsed < 3500) {
      phase = 3;
    } else {
      // Stop
      stopDraw();
      return;
    }

    flashIdx = (flashIdx + 1) % available.length;
    const g = available[flashIdx];
    updateDisplay(g, '第' + g + '组', '');
    document.getElementById('displayArea').classList.add('spinning');
    renderGrid(g);

    const delay = phase === 1 ? 60 : phase === 2 ? 130 : 280;
    spinTimer = setTimeout(cycle, delay);
  }

  cycle();
}

function stopDraw() {
  spinning = false;
  if (spinTimer) { clearTimeout(spinTimer); spinTimer = null; }
  if (flashTimer) { clearTimeout(flashTimer); flashTimer = null; }

  const available = getAvailable();
  const pick = available[Math.floor(Math.random() * available.length)];

  history.push(pick);
  pickedGroup = pick;
  saveHistory();

  const area = document.getElementById('displayArea');
  area.classList.remove('spinning');
  area.classList.add('result');
  updateDisplay(pick, '第' + pick + '组', 'result');
  document.getElementById('resultText').style.display = 'block';

  const btn = document.getElementById('btnDraw');
  btn.textContent = available.length > 1 ? '继续抽取' : '已全部抽完';
  btn.classList.remove('drawing');
  if (available.length === 1) btn.disabled = true;
  document.getElementById('btnReset').disabled = false;

  renderGrid();
  renderHistory();
}

function resetAll() {
  if (spinning) {
    if (spinTimer) clearTimeout(spinTimer);
    if (flashTimer) clearTimeout(flashTimer);
    spinning = false;
  }
  history = [];
  pickedGroup = null;
  saveHistory();
  updateDisplay('?', '准备开始', '');
  const area = document.getElementById('displayArea');
  area.classList.remove('spinning', 'result');
  document.getElementById('resultText').style.display = 'none';
  const btn = document.getElementById('btnDraw');
  btn.textContent = '开始抽取';
  btn.classList.remove('drawing');
  btn.disabled = false;
  document.getElementById('btnReset').disabled = false;
  renderGrid();
  renderHistory();
}

// Init
history = loadHistory();
pickedGroup = history.length > 0 ? history[history.length - 1] : null;
if (pickedGroup) {
  const area = document.getElementById('displayArea');
  area.classList.add('result');
  updateDisplay(pickedGroup, '第' + pickedGroup + '组', 'result');
  document.getElementById('resultText').style.display = 'block';
}
renderGrid();
renderHistory();
if (history.length >= TOTAL) {
  document.getElementById('btnDraw').disabled = true;
  document.getElementById('btnDraw').textContent = '已全部抽完';
}
</script>
</body>
</html>
